<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-labelledby="chest-title chest-desc" style="max-width:100%;height:auto">
  <title id="chest-title">Animated FitTribe Jungle Loot Chest</title>
  <desc id="chest-desc">An ornate wooden and gold-trimmed Jungle Quest treasure chest that wobbles with anticipation, pops open its hinged lid, and bursts with golden light rays, XP stars, emerald gems, and bamboo coins.</desc>

  <defs>
    <!-- Warm Jungle Sanctuary Backdrop -->
    <radialGradient id="chestBg" cx="50%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>

    <!-- Golden Treasure Glow Inside Chest -->
    <radialGradient id="treasureGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Rich Mahogany / Teak Wood Planks -->
    <linearGradient id="woodBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="woodLid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Forged Gold Trim & Straps -->
    <linearGradient id="goldBand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Emerald Jungle Gem Gradient -->
    <linearGradient id="emeraldGem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Cyan XP Crystal Gradient -->
    <linearGradient id="cyanGem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <style>
    /* 4.8s Full Cycle:
       0-32%: Anticipation wobble + squash
       36-78%: Lid pops open, chest leaps slightly, loot & rays burst out
       84-100%: Lid closes smoothly and settles back to idle */

    .chest-unit {
      transform-origin: 240px 395px;
      animation: chestCycle 4.8s ease-in-out infinite;
    }
    @keyframes chestCycle {
      0%, 10%, 90%, 100% { transform: translateY(0) scale(1, 1) rotate(0deg); }
      14% { transform: translateY(4px) scale(1.05, 0.94) rotate(-3deg); }
      18% { transform: translateY(-4px) scale(0.97, 1.03) rotate(3.5deg); }
      22% { transform: translateY(3px) scale(1.04, 0.95) rotate(-3.5deg); }
      26% { transform: translateY(8px) scale(1.08, 0.90) rotate(0deg); }
      34% { transform: translateY(-18px) scale(0.95, 1.06) rotate(0deg); }
      44%, 72% { transform: translateY(-8px) scale(1, 1) rotate(0deg); }
      82% { transform: translateY(4px) scale(1.03, 0.97) rotate(0deg); }
    }

    .chest-shadow {
      transform-box: fill-box;
      transform-origin: center;
      animation: chestShadow 4.8s ease-in-out infinite;
    }
    @keyframes chestShadow {
      0%, 10%, 90%, 100% { transform: scale(1); opacity: 0.24; }
      26% { transform: scale(1.1); opacity: 0.30; }
      34% { transform: scale(0.82); opacity: 0.14; }
      44%, 72% { transform: scale(0.9); opacity: 0.18; }
    }

    /* Lid Hinges Open from Back Upper Seam */
    .chest-lid {
      transform-origin: 240px 258px;
      animation: lidOpen 4.8s ease-in-out infinite;
    }
    @keyframes lidOpen {
      0%, 26%, 86%, 100% { transform: translateY(0) rotate(0deg) scaleY(1); }
      34%, 72% { transform: translateY(-42px) rotate(-14deg) scaleY(0.92); }
      78% { transform: translateY(-12px) rotate(-4deg) scaleY(0.98); }
    }

    /* Inner Gold Glow & Sunbeams Burst When Lid Opens */
    .burst-glow {
      transform-origin: 240px 255px;
      animation: glowBurst 4.8s ease-in-out infinite;
    }
    @keyframes glowBurst {
      0%, 27%, 82%, 100% { opacity: 0; transform: scale(0.4); }
      35%, 70% { opacity: 1; transform: scale(1.12); }
    }

    .sunbeams {
      transform-origin: 240px 255px;
      animation: beamSpin 18s linear infinite;
    }
    @keyframes beamSpin {
      to { transform: rotate(360deg); }
    }

    /* Floating Loot Items Erupting from Open Chest */
    .loot-star {
      transform-origin: 240px 250px;
      animation: popCenter 4.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .loot-gem-l {
      transform-origin: 200px 250px;
      animation: popLeft 4.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .loot-coin-r {
      transform-origin: 280px 250px;
      animation: popRight 4.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes popCenter {
      0%, 28%, 82%, 100% { opacity: 0; transform: translateY(25px) scale(0.2) rotate(-20deg); }
      38% { opacity: 1; transform: translateY(-108px) scale(1.15) rotate(8deg); }
      55% { opacity: 1; transform: translateY(-96px) scale(1) rotate(-4deg); }
      72% { opacity: 1; transform: translateY(-104px) scale(1.05) rotate(4deg); }
    }
    @keyframes popLeft {
      0%, 29%, 80%, 100% { opacity: 0; transform: translate(20px, 25px) scale(0.2) rotate(0deg); }
      40% { opacity: 1; transform: translate(-72px, -78px) scale(1.1) rotate(-18deg); }
      58% { opacity: 1; transform: translate(-68px, -68px) scale(1) rotate(-10deg); }
      72% { opacity: 1; transform: translate(-72px, -74px) scale(1.04) rotate(-15deg); }
    }
    @keyframes popRight {
      0%, 30%, 80%, 100% { opacity: 0; transform: translate(-20px, 25px) scale(0.2) rotate(0deg); }
      42% { opacity: 1; transform: translate(74px, -76px) scale(1.1) rotate(18deg); }
      60% { opacity: 1; transform: translate(68px, -66px) scale(1) rotate(10deg); }
      72% { opacity: 1; transform: translate(72px, -72px) scale(1.04) rotate(16deg); }
    }

    /* Keyhole Lock Pulse */
    .lock-gem {
      animation: gemPulse 2.4s ease-in-out infinite;
    }
    @keyframes gemPulse {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }

    /* Twinkling Ambient Sparkles */
    .sparkle {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkleS 2s ease-in-out infinite;
    }
    .sparkle.sp2 { animation-delay: 0.6s; }
    .sparkle.sp3 { animation-delay: 1.2s; }
    @keyframes twinkleS {
      0%, 100% { opacity: 0.2; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Rounded Background Frame -->
  <rect width="480" height="480" rx="36" fill="url(#chestBg)"/>

  <!-- Decorative Temple Ring -->
  <circle cx="240" cy="250" r="186" fill="#ffffff" opacity="0.45"/>
  <circle cx="240" cy="250" r="168" fill="none" stroke="#fcd34d" stroke-width="6" stroke-dasharray="24 14" opacity="0.7"/>

  <!-- Rotating Sunbeam Rays (Visible During Chest Burst) -->
  <g class="burst-glow">
    <circle cx="240" cy="235" r="155" fill="url(#treasureGlow)"/>
    <g class="sunbeams" opacity="0.55" fill="#fde047">
      <polygon points="240,235 215,55 265,55"/>
      <polygon points="240,235 375,95 405,135"/>
      <polygon points="240,235 425,215 425,265"/>
      <polygon points="240,235 395,355 355,390"/>
      <polygon points="240,235 125,390 85,355"/>
      <polygon points="240,235 55,265 55,215"/>
      <polygon points="240,235 75,135 105,95"/>
    </g>
  </g>

  <!-- Ground Shadow -->
  <ellipse class="chest-shadow" cx="240" cy="414" rx="142" ry="18" fill="#78350f"/>

  <!-- Jungle Leaves Framing Base -->
  <g stroke="#14532d" stroke-width="3" stroke-linejoin="round">
    <path d="M98 396 Q54 374 42 394 Q64 416 102 406 Z" fill="#22c55e"/>
    <path d="M112 388 Q74 352 60 368 Q78 394 110 396 Z" fill="#4ade80"/>
    <path d="M382 396 Q426 374 438 394 Q416 416 378 406 Z" fill="#22c55e"/>
    <path d="M368 388 Q406 352 420 368 Q402 394 370 396 Z" fill="#4ade80"/>
  </g>

  <!-- ================= ANIMATED CHEST ASSEMBLY ================= -->
  <g class="chest-unit">

    <!-- Dark Chest Interior Cavity + Heap of Gold Coins (Revealed When Lid Opens) -->
    <rect x="116" y="236" width="248" height="58" rx="14" fill="#271206" stroke="#23272e" stroke-width="4"/>
    <g class="burst-glow">
      <ellipse cx="240" cy="266" rx="108" ry="24" fill="#facc15"/>
      <circle cx="182" cy="262" r="16" fill="#fde047" stroke="#b45309" stroke-width="2.5"/>
      <circle cx="214" cy="254" r="18" fill="#fef08a" stroke="#b45309" stroke-width="2.5"/>
      <circle cx="258" cy="256" r="17" fill="#fde047" stroke="#b45309" stroke-width="2.5"/>
      <circle cx="294" cy="264" r="15" fill="#facc15" stroke="#b45309" stroke-width="2.5"/>
    </g>

    <!-- ================= ERUPTING LOOT ITEMS ================= -->
    <!-- Left Loot: Cyan XP Crystal Diamond -->
    <g class="loot-gem-l">
      <polygon points="200,214 224,238 200,272 176,238" fill="url(#cyanGem)" stroke="#23272e" stroke-width="3.5" stroke-linejoin="round"/>
      <polygon points="200,214 214,238 200,262 186,238" fill="#cffafe" opacity="0.55"/>
      <line x1="176" y1="238" x2="224" y2="238" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- Right Loot: Gold Bamboo Tribe Coin -->
    <g class="loot-coin-r">
      <circle cx="280" cy="242" r="24" fill="url(#goldBand)" stroke="#23272e" stroke-width="3.5"/>
      <circle cx="280" cy="242" r="17" fill="#fef08a" stroke="#b45309" stroke-width="2"/>
      <!-- Bamboo Icon Inside Coin -->
      <rect x="277" y="230" width="6" height="24" rx="3" fill="#16a34a"/>
      <path d="M283 236 Q292 230 293 236 Q288 241 283 239 Z" fill="#16a34a"/>
    </g>

    <!-- Center Hero Loot: Giant Golden XP Star -->
    <g class="loot-star">
      <polygon points="240,196 251,220 277,223 257,241 263,267 240,253 217,267 223,241 203,223 229,220"
               fill="url(#goldBand)" stroke="#23272e" stroke-width="4" stroke-linejoin="round"/>
      <polygon points="240,206 247,222 264,224 251,236 255,253 240,244 225,253 229,236 216,224 233,222"
               fill="#fef9c3" opacity="0.7"/>
      <circle cx="234" cy="224" r="3.5" fill="#ffffff"/>
    </g>

    <!-- ================= CHEST LOWER BASE BOX ================= -->
    <g>
      <!-- Main Wooden Box -->
      <path d="M108 268 L372 268 L358 394 Q356 408 340 408 L140 408 Q124 408 122 394 Z"
            fill="url(#woodBase)" stroke="#23272e" stroke-width="4.5" stroke-linejoin="round"/>

      <!-- Horizontal Wood Plank Seams -->
      <line x1="115" y1="314" x2="365" y2="314" stroke="#451a03" stroke-width="3.5" opacity="0.65"/>
      <line x1="120" y1="360" x2="360" y2="360" stroke="#451a03" stroke-width="3.5" opacity="0.65"/>

      <!-- Left & Right Vertical Gold Armor Straps -->
      <path d="M110 268 L148 268 L156 408 L136 408 Q123 408 121 394 Z"
            fill="url(#goldBand)" stroke="#23272e" stroke-width="4" stroke-linejoin="round"/>
      <path d="M332 268 L370 268 L359 394 Q357 408 344 408 L324 408 Z"
            fill="url(#goldBand)" stroke="#23272e" stroke-width="4" stroke-linejoin="round"/>

      <!-- Bottom Gold Corner Brackets & Rivets -->
      <circle cx="136" cy="292" r="4.5" fill="#fef08a" stroke="#23272e" stroke-width="2"/>
      <circle cx="140" cy="338" r="4.5" fill="#fef08a" stroke="#23272e" stroke-width="2"/>
      <circle cx="143" cy="384" r="4.5" fill="#fef08a" stroke="#23272e" stroke-width="2"/>
      <circle cx="344" cy="292" r="4.5" fill="#fef08a" stroke="#23272e" stroke-width="2"/>
      <circle cx="340" cy="338" r="4.5" fill="#fef08a" stroke="#23272e" stroke-width="2"/>
      <circle cx="337" cy="384" r="4.5" fill="#fef08a" stroke="#23272e" stroke-width="2"/>

      <!-- Center Ornate Gold Lock Plate on Base -->
      <path d="M208 268 L272 268 L266 334 L240 352 L214 334 Z"
            fill="url(#goldBand)" stroke="#23272e" stroke-width="4" stroke-linejoin="round"/>
      <!-- Glowing Emerald Keyhole Gem -->
      <polygon class="lock-gem" points="240,286 254,304 240,328 226,304"
               fill="url(#emeraldGem)" stroke="#23272e" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="240,291 247,304 240,316 233,304" fill="#a7f3d0" opacity="0.7"/>
    </g>

    <!-- ================= CHEST HINGED DOMED LID ================= -->
    <g class="chest-lid">
      <!-- Domed Wooden Lid -->
      <path d="M102 270
               Q106 184 166 176
               L314 176
               Q374 184 378 270
               Z"
            fill="url(#woodLid)" stroke="#23272e" stroke-width="4.5" stroke-linejoin="round"/>

      <!-- Lid Specular Wood Highlight -->
      <path d="M148 196 Q240 188 332 196" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" opacity="0.55"/>

      <!-- Left & Right Lid Gold Straps -->
      <path d="M104 270 Q108 192 158 176 L186 176 Q152 198 150 270 Z"
            fill="url(#goldBand)" stroke="#23272e" stroke-width="4" stroke-linejoin="round"/>
      <path d="M376 270 Q372 192 322 176 L294 176 Q328 198 330 270 Z"
            fill="url(#goldBand)" stroke="#23272e" stroke-width="4" stroke-linejoin="round"/>

      <!-- Lid Bottom Gold Rim Band -->
      <rect x="98" y="254" width="284" height="20" rx="8" fill="url(#goldBand)" stroke="#23272e" stroke-width="4"/>

      <!-- Center Gold Crest Clasp on Lid -->
      <path d="M214 236 L266 236 L260 282 L240 294 L220 282 Z"
            fill="url(#goldBand)" stroke="#23272e" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="240" cy="262" r="9" fill="url(#emeraldGem)" stroke="#23272e" stroke-width="3"/>
      <circle cx="237" cy="259" r="3" fill="#ffffff"/>
    </g>

  </g>

  <!-- Ambient Sparkles Around Chest -->
  <g class="sparkle sp1" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round">
    <path d="M92 146 v22 M81 157 h22"/>
  </g>
  <g class="sparkle sp2" stroke="#10b981" stroke-width="4.5" stroke-linecap="round">
    <path d="M392 134 v22 M381 145 h22"/>
  </g>
  <g class="sparkle sp3" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round">
    <path d="M126 92 v18 M117 101 h18"/>
  </g>
</svg>
